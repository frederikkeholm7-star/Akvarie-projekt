<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akvarie</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <main>
      <section class="baggrund"></section>

      <section class="start-side"></section>
        <button id="play-button" type="button">▶</button>

      <section class="akvarie"></section>

        <div class="fisk-container">

          <img src="img/Gul fisk-1.svg"
          id="gul fisk 1"
          class="fisk"
          alt="Orangeplettet kirurg"
          />

          <img src="img/Fisk 2.svg"
          id="fisk2"
          class="fisk"
          alt="Hvidstrubet kirug"
          />

          <img src="img/f10-1.svg"
          id="fisk3"
          class="fisk"    
          alt="Sortbundet kirurg"
          />

          <img src="img/Fisk 1 · Vektor.svg"
          id="fisk4"
          class="fisk"
          alt="Banggai-kardinalfisk"
          />

          <img src="img/Fisk 2 · Vektor-1.svg"
          id="fisk5"
          class="fisk"
          alt="Sommerfuglecichlide"
          />

          <img src="img/Nemo fisk-1.svg"
          id="klovn-fisk"
          class="fisk"
          alt="Nemo"
          />

          <img src="img/Frame 11-1.svg"
          id="fisk7"
          class="fisk"
          alt="Blå kirurgfisk"
          />

          <img src="img"
          id="fisk8"
          class="fisk"
          alt=""
          />

          <img src="img/Hvidt STORCENTER Nord-logo på gennemsigtig baggrund.png"/>

        </div>
      </section>
      <div class="textbox">
          <h2>Rævefisk</h2>
          <h3>Hvor gammel er jeg?</h3>
          <h3>Hvor bor jeg?</h3>
          <h3>Hvad spiser jeg?</h3>
          <h3>Hvad vejer jeg?</h3>
          <h3>Hvad er min superkræft?</h3>
      </div>
    </main>
  </body>
</html>
